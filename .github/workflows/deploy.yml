name: Build and Deploy

on:
  push:
    branches:
      - master
  pull_request:
  workflow_dispatch:

jobs:
  # Runs on pull requests too, so a regression is caught before it reaches
  # master rather than after it has already deployed.
  test:
    name: Typecheck and test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install server dependencies
        run: npm ci --legacy-peer-deps

      - name: Install client dependencies
        run: npm ci --legacy-peer-deps
        working-directory: client

      - name: Typecheck server
        run: npx tsc --noEmit

      - name: Server tests
        run: npm test

      - name: Client tests
        run: npm test
        working-directory: client

      - name: Build client
        run: npm run build
        working-directory: client
        env:
          VITE_API_URL: /api

  deploy:
    name: Deploy to Railway
    # The gate: a failing typecheck or test suite blocks the deploy.
    needs: test
    if: github.ref == 'refs/heads/master' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Install Railway CLI
        run: npm install -g @railway/cli

      - name: Build client
        run: |
          cd client
          npm ci --legacy-peer-deps
          npm run build
        env:
          VITE_API_URL: /api

      - name: Deploy to Railway
        run: railway up --detached
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
