<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- No maximum-scale / user-scalable=no: blocking pinch-zoom fails WCAG 1.4.4
         and makes the incident forms unusable for anyone who needs to zoom. -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#26A69A" />
    <meta name="description" content="SCCS Student Discipline Tracking System" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="SCCS" />
    <!-- Student records must never be indexed. -->
    <meta name="robots" content="noindex, nofollow" />
    <link rel="manifest" href="/manifest.json" />
    <link rel="icon" type="image/svg+xml" href="/icon.svg" />
    <link rel="apple-touch-icon" href="/icon-192.png" />
    <title>SCCS Discipline Tracker</title>
  </head>
  <body>
    <div id="root"></div>
    <!-- The service worker is registered from main.tsx. It must not be done with
         an inline script: the Content-Security-Policy sets script-src 'self',
         which blocks inline execution. -->
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
